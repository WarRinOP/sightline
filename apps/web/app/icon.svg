<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: the Sun just over the Moon's limb. A standalone file, so it cannot read the page's CSS
       variables; the colours are the tokens in globals.css: --void #05070a, --sun #ffc857,
       --sun-hot #ffe3a3, --dark #4b3fc4. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14" /></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#05070a" />
    <circle cx="32" cy="27" r="13" fill="#ffc857" />
    <circle cx="32" cy="27" r="7" fill="#ffe3a3" />
    <circle cx="32" cy="88" r="52" fill="#4b3fc4" stroke="#ffc857" stroke-width="2" />
  </g>
</svg>
