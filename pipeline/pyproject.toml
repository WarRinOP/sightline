[project]
name = "sightline-pipeline"
version = "0.1.0"
description = "SIGHTLINE data pipeline: LOLA terrain, SPICE ephemeris, tiles, golden fixtures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "spiceypy>=8.0",
]

[project.scripts]
sightline = "sightline_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = ["mypy>=2.0", "pytest>=9.0", "ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sightline_pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# These ship no type stubs, and stub packages are not on the approved dependency list.
[[tool.mypy.overrides]]
module = ["yaml", "rasterio", "rasterio.*", "spiceypy"]
ignore_missing_imports = true
