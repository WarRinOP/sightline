[project]
name = "sightline-pipeline"
version = "0.0.0"
description = "SIGHTLINE data pipeline: LOLA terrain, SPICE ephemeris, tiles, golden fixtures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sightline = "sightline_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = ["mypy>=2.0", "pytest>=9.0", "ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sightline_pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
